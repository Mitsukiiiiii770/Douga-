<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Douga の設定</title>
    <style>
      body {
        width: auto;
        max-width: 640px;
        max-height: none;
        margin: 0 auto;
        padding: 24px 20px;
      }
      header {
        position: static;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      section {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-elevated);
        margin-bottom: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      input[type="number"] {
        width: 120px;
        background: #22262f;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        padding: 7px 9px;
        font-family: inherit;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">▶</span> Douga の設定</div>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">確認中…</span>
      </div>
    </header>

    <section>
      <h2>デスクトップアプリとの接続</h2>
      <label class="field">
        <span>待ち受けポート（アプリ側の設定と合わせてください）</span>
        <input type="number" id="port" min="1024" max="65535" />
      </label>
      <div class="section-head">
        <button id="pair-btn" class="primary">接続 / 再接続</button>
        <button id="unpair-btn">この拡張の接続情報を消す</button>
      </div>
      <p class="hint" id="pair-state"></p>
    </section>

    <section>
      <h2>Cookie の送信</h2>
      <label class="check">
        <input type="checkbox" id="send-cookies" />
        <span>動画を送るときに、そのサイトの Cookie も一緒に送る</span>
      </label>
      <p class="hint">
        ログインが必要なサイトの動画を取得するために使います。Cookie
        はデスクトップアプリにのみ送信され、アプリ側では一時ファイルに書き出したうえで、
        ダウンロード完了時とアプリ終了時に削除されます。必要なときだけ有効にしてください。
      </p>
    </section>

    <section>
      <h2>注意</h2>
      <p class="hint">
        DRM（Widevine / PlayReady / FairPlay）で保護された動画には対応していません。
        各サイトの利用規約と著作権法の範囲内でご利用ください。
      </p>
    </section>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
