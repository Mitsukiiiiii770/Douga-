<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Douga</title>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">▶</span> Douga</div>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">確認中…</span>
      </div>
    </header>

    <div class="connect" id="connect" hidden>
      <p id="connect-msg"></p>
      <button id="connect-btn" class="primary">アプリと接続</button>
    </div>

    <section class="preview" id="preview" hidden>
      <img class="preview-thumb" id="preview-thumb" alt="" hidden />
      <div class="preview-meta">
        <div class="preview-title" id="preview-title"></div>
        <div class="preview-sub" id="preview-sub"></div>
      </div>
    </section>

    <section class="page-action">
      <button id="send-page" class="primary block">このページをアプリで開く</button>
      <p class="hint" id="page-target" hidden></p>
      <p class="hint" id="site-note">
        YouTube のような動画サイトは、個別のストリームより確実に取得できます。
      </p>
    </section>

    <section>
      <div class="section-head">
        <h2>検出された動画</h2>
        <button id="refresh" class="link">再スキャン</button>
      </div>
      <ul id="list"></ul>
      <p class="empty" id="empty">
        まだ見つかっていません。動画を再生してから、もう一度開いてください。
      </p>
      <p class="hint" id="mse-hint" hidden>
        このページは MediaSource（blob:）で再生しています。上の HLS / DASH
        マニフェストを選ぶか、「このページをアプリで開く」を使ってください。
      </p>
    </section>

    <footer>
      <label class="check">
        <input type="checkbox" id="send-cookies" />
        <span>Cookie を一緒に送る（ログインが必要なサイト用）</span>
      </label>
      <a href="#" id="open-options">設定</a>
      <a href="#" id="show-report">検出ログ</a>
    </footer>

    <section id="report-box" hidden>
      <div class="report-head">
        <strong>検出ログ</strong>
        <button id="copy-report" class="ghost">コピー</button>
        <button id="close-report" class="ghost">閉じる</button>
      </div>
      <textarea id="report-text" readonly spellcheck="false"></textarea>
    </section>

    <div class="toast" id="toast" hidden></div>

    <script src="site-hints.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
